apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-Deployment 
spec:
  repliers: 2
  selector: 
    matchLabels:
      app: flask-demo 
  template:
    metadata:
      labels:
        app: flask-demo 
    spec: 
      containers:
        - name: flask-demo 
          image: flask-demo:latest 
          imagePullPolicy: Never
          ports:
            - containerPort: 5000

  